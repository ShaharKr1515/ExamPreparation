<!doctype html>
<html lang="he" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>הכנה לבחינות</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrap">
        <header class="page-header">
            <h1>📝 הכנה לבחינות</h1>
            <p class="subtitle">עמודה = בחינה. בכל בחינה 5 שאלות (מסודרות אנכית), ולכל שאלה: הצלחה, תאריך אחרון ונקודות.
            </p>
        </header>

        <div class="notice" role="note">
            <span aria-hidden="true">🗑️</span>
            <div>
                <strong>המידע אינו נשמר.</strong>
                הנתונים נשמרים בזיכרון הדף בלבד — רענון הדף ימחק את כל מה שהוזן.
            </div>
        </div>

        <div id="subject-bar" class="subject-bar" aria-label="סינון לפי מקצוע"></div>

        <div class="toolbar">
            <form id="add-form" class="add-form" autocomplete="off">
                <input id="exam-name" type="text" placeholder="שם הבחינה (למשל: בחינת מתמטיקה 5 יח'…)"
                    aria-label="שם הבחינה">
                <input id="exam-subject" type="text" required placeholder="* מקצוע (למשל: מתמטיקה, אנגלית, פיזיקה…)"
                    aria-label="מקצוע">
                <button type="submit" class="btn primary">+ הוספת בחינה</button>
            </form>
            <span id="count" class="count"></span>
            <button id="clear-all" class="btn danger-ghost" type="button">ניקוי הכול</button>
        </div>

        <div class="table-card">
            <div id="exam-grid" class="exam-grid"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
